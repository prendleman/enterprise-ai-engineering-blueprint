name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version tag
        required: true
        default: "0.1.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest

      - name: Build Docker image
        run: docker build -t enterprise-ai-engineering-blueprint:${{ inputs.version }} .

      - name: Produce release metadata
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          meta = {
              "project": "enterprise-ai-engineering-blueprint",
              "version": "${{ inputs.version }}",
              "built_at": datetime.now(timezone.utc).isoformat(),
              "promotion": "simulated-staging",
              "notes": "Local/CI simulated release promotion — no cloud deploy required.",
          }
          Path("release-metadata.json").write_text(json.dumps(meta, indent=2), encoding="utf-8")
          print(json.dumps(meta, indent=2))
          PY

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: release-metadata.json
