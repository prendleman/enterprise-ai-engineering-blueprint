[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-engineering-blueprint"
version = "0.1.0"
description = "Governed agentic AI reference architecture for enterprise software engineering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "streamlit>=1.39.0",
  "duckdb>=1.1.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
openai = ["openai>=1.54.0"]
anthropic = ["anthropic>=0.39.0"]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-requests>=2.32.0",
]

[project.scripts]
eaeb-demo = "scripts.demo:main"
eaeb-validate = "scripts.validate_repo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["app"]
exclude = ["tests", "scripts", "dashboard"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "streamlit.*", "openai.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=80"
